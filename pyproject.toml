[project]
name = "obsidianagent"
version = "0.2.0"
description = "Dedalus-powered agent for Obsidian vault management via CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dedalus-labs",
    "dedalus-sdk",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "textual>=0.80.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.29",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
obsidian-agent = "tui.tui:main"

[tool.setuptools.packages.find]
include = ["obsidian_agent*", "api*", "tui*", "tui_ts*"]
